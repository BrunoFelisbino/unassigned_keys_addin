<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chaves Não Cadastradas - Frota</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{box-sizing:border-box}:root{--bg:#f5f8fc;--card:#fff;--card2:#f8fbff;--txt:#172033;--mut:#64748b;--mut2:#94a3b8;--bd:#e5eaf1;--blue:#0ea5e9;--blue2:#0369a1;--green:#10b981;--yellow:#f59e0b;--orange:#f97316;--red:#ef4444;--gray:#64748b;--shadow:0 12px 28px rgba(15,23,42,.06);--mono:Consolas,monospace}body,#app{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);min-height:100vh;color:var(--txt);padding:16px 20px;background-image:radial-gradient(circle,rgba(15,23,42,.045) 1px,transparent 1px);background-size:24px 24px}.head,.bar,.info,.panel,.kpi{background:var(--card);border:1px solid var(--bd);border-radius:16px;box-shadow:var(--shadow)}.head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;margin-bottom:12px}.title{display:flex;gap:10px;align-items:center;font-weight:800;font-size:18px}.ico{width:46px;height:46px;border-radius:10px;background:#000;display:grid;place-items:center;overflow:hidden}.ico img{width:100%;height:100%;object-fit:contain;display:block}.sub{font-family:var(--mono);font-size:10px;color:var(--mut);font-weight:400}.pill{font-family:var(--mono);font-size:10px;color:var(--blue2);background:#fff;border:1px solid var(--bd);border-radius:99px;padding:5px 12px}.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px;margin-bottom:12px}.info{display:flex;gap:16px;flex-wrap:wrap;padding:9px 14px;margin-bottom:12px;color:var(--mut);font-size:12px}button,select,input{height:32px;border-radius:8px;border:1px solid var(--bd);background:#fff;color:var(--txt);font-size:11px;padding:0 10px}button{font-weight:700;cursor:pointer}.primary{background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;border:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:12px}.kpi{padding:16px 14px;min-height:116px;position:relative;overflow:hidden}.kpi span{display:block;color:var(--mut2);font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px}.kpi b{font-family:var(--mono);font-size:30px;line-height:1}.kpi small{display:block;color:var(--mut);font-size:12px;margin-top:4px}.panel{padding:16px 18px;margin-bottom:12px}.pt{font-size:12px;font-weight:800;color:var(--blue2);letter-spacing:.06em;text-transform:uppercase;margin-bottom:12px}.pt:before{content:'';display:inline-block;width:3px;height:12px;background:linear-gradient(var(--blue),var(--blue2));border-radius:2px;margin-right:7px;vertical-align:-2px}table{width:100%;border-collapse:collapse;font-size:11px}th{text-align:left;background:#f0f9ff;color:var(--blue2);font-size:9px;text-transform:uppercase;letter-spacing:.06em;padding:8px 10px}td{padding:8px 10px;border-bottom:1px solid #edf2f7;color:var(--mut);vertical-align:middle}tr:hover td{background:#f8fbff}.badge{display:inline-block;border-radius:99px;padding:2px 9px;font-size:10px;font-weight:800;font-family:var(--mono)}.okb{background:rgba(16,185,129,.12);color:#047857}.warnb{background:rgba(245,158,11,.13);color:#92400e}.riskb{background:rgba(239,68,68,.11);color:#991b1b}.map{height:380px;border:1px solid var(--bd);border-radius:16px;overflow:hidden}.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:1000}.modal{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:20px;min-width:320px;max-width:480px;box-shadow:var(--shadow)}.modal h3{margin-bottom:12px;color:var(--blue2)}.modal .row{display:flex;gap:8px;margin-top:12px;justify-content:flex-end}button[disabled]{opacity:.78;cursor:wait}.spinner{width:14px;height:14px;display:inline-block;border:2px solid rgba(255,255,255,.5);border-top-color:#fff;border-radius:50%;vertical-align:-2px;margin-right:7px;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:700px){body,#app{padding:10px}.bar{align-items:stretch;flex-direction:column}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app">
  <div class="head">
    <div class="title">
      <div class="ico"><span>CK</span></div>
      <div><strong>Chaves Não Cadastradas</strong><div class="sub">Controle de cartões não vinculados • Geotab</div></div>
    </div>
    <div class="pill" id="statusBox">Pronto</div>
  </div>
  <div class="bar">
    <button class="primary" id="btn-fetch">Buscar dados</button>
    <select id="sel-group"><option value="">Todos os grupos</option></select>
    <select id="sel-device"><option value="">Todos os veículos</option></select>
    <input id="inp-search" placeholder="Placa ou cartão..."/>
  </div>
  <div class="info">
    <span>Veículos analisados: <b id="countBox">0</b></span>
    <span id="filterInfo"></span>
  </div>
  <div id="kpisBox" class="grid"></div>
  <div id="map" class="map" style="margin-bottom:12px;"></div>
  <div class="panel">
    <div class="pt">Registros de chaves não cadastradas</div>
    <div id="tableBox"></div>
  </div>
</div>
<div class="modal-bg" id="modal-bg">
  <div class="modal">
    <h3>Vincular cartão</h3>
    <div id="modal-card" style="font-family:var(--mono);margin-bottom:10px;"></div>
    <label style="font-size:11px;color:var(--mut2);">Usuário (motorista)</label>
    <select id="modal-user" style="width:100%;margin-top:4px;"></select>
    <div class="row">
      <button id="modal-cancel">Cancelar</button>
      <button class="primary" id="modal-save">Vincular</button>
    </div>
  </div>
</div>
<script>
var _api,_state; var allData=[]; var deviceMap={}; var groupMap={}; var userMap={}; var map=null; var layer=null;
var isMockMode=typeof window.geotab==='undefined';
if(isMockMode){window.geotab={addin:{}};}else{window.geotab=window.geotab||{};window.geotab.addin=window.geotab.addin||{};}
window.geotab.addin.unassigned_keys=function(api,state){_api=api;_state=state;loadLookups();setStatus('Pronto');};

function loadLookups(){
  _api.call('Get',{typeName:'Group'},function(g){groupMap={};(g||[]).forEach(function(x){groupMap[x.id]=x;});populateGroup();},function(){});
  _api.call('Get',{typeName:'Device'},function(d){deviceMap={};(d||[]).forEach(function(x){deviceMap[x.id]=x;});populateDevice();initMap();},function(){});
  _api.call('Get',{typeName:'User'},function(u){userMap={};(u||[]).forEach(function(x){if(x.isDriver) userMap[x.id]=x;});populateUsers();},function(){});
}
function populateGroup(){var s=document.getElementById('sel-group');s.innerHTML='<option value="">Todos os grupos</option>'+Object.values(groupMap).sort(function(a,b){return a.name.localeCompare(b.name);}).map(function(g){return '<option value="'+esc(g.id)+'">'+esc(g.name)+'</option>';}).join('');}
function populateDevice(){var s=document.getElementById('sel-device');var g=document.getElementById('sel-group').value;s.innerHTML='<option value="">Todos os veículos</option>'+Object.values(deviceMap).filter(function(d){return !g|| (d.groups||[]).some(function(x){return x.id===g;})||d.groupId===g;}).sort(function(a,b){return (a.name||'').localeCompare(b.name||'');}).map(function(d){return '<option value="'+esc(d.id)+'">'+esc(inferPlate(d))+'</option>';}).join('');}
function populateUsers(){var s=document.getElementById('modal-user');s.innerHTML=Object.values(userMap).sort(function(a,b){return (a.firstName||a.name||'').localeCompare(b.firstName||b.name||'');}).map(function(u){return '<option value="'+esc(u.id)+'">'+esc((u.firstName||'')+' '+(u.lastName||'')+' ('+(u.name||'')+')')+'</option>';}).join('');}
function inferPlate(d){var p=(d.licensePlate||'').trim();if(p)return p;var n=(d.name||'').trim();var m=n.match(/^([^|]+)\s*\|/);if(m&&m[1])return m[1].trim();return n||d.id;}
function initMap(){map=L.map('map').setView([-15.8,-47.9],4);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OSM'}).addTo(map);layer=L.layerGroup().addTo(map);setTimeout(function(){map.invalidateSize();},300);}
function setStatus(t){var e=document.getElementById('statusBox');if(e)e.textContent=t;}
function set(id,v){var e=document.getElementById(id);if(e)e.textContent=v;}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fmtD(d){if(!d)return'—';return new Date(d).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});}
function getRange(){var now=new Date(),today=new Date(now.getFullYear(),now.getMonth(),now.getDate());return{from:new Date(today.getTime()-29*864e5),to:now};}

function fetchAudit(){
  setStatus('Consultando...');
  document.getElementById('btn-fetch').disabled=true;
  var rng=getRange();
  _api.call('Get',{typeName:'Audit',search:{fromDate:rng.from.toISOString(),toDate:rng.to.toISOString()}},function(res){
    document.getElementById('btn-fetch').disabled=false;
    allData=[];
    (res||[]).forEach(function(a){
      var txt=(a.name||'')+' '+(a.comment||'');
      var low=txt.toLowerCase();
      if(low.indexOf('key')===-1 && low.indexOf('chave')===-1 && low.indexOf('cart')===-1 && low.indexOf('inserir')===-1) return;
      var m=txt.match(/(\d{6,})/);
      var serial=m?m[1]:'—';
      var plate='—';
      var pm=txt.match(/([A-Z]{3}\d[A-Z0-9]\d{2})/);
      if(pm) plate=pm[1];
      allData.push({dateTime:a.dateTime,name:a.name,comment:a.comment,serial:serial,plate:plate});
    });
    render();
    setStatus(allData.length+' registros');
  },function(e){document.getElementById('btn-fetch').disabled=false;setStatus('Erro');console.error(e);});
}
function render(){
  set('countBox',allData.length);
  var kpis=[['Tentativas',allData.length,'registros no período','var(--red)'],['Cartões não cadastrados',new Set(allData.map(function(r){return r.serial;})).size,'seriais distintos','var(--orange)'],['Veículos afetados',new Set(allData.map(function(r){return r.plate;})).size,'dispositivos únicos','var(--blue)']];
  document.getElementById('kpisBox').innerHTML=kpis.map(function(r){return '<div class="kpi"><span>'+r[0]+'</span><b style="color:'+r[3]+'">'+r[1]+'</b><small>'+r[2]+'</small></div>';}).join('');
  document.getElementById('tableBox').innerHTML= allData.length? ('<table><thead><tr><th>Data/Hora</th><th>Veículo (Placa)</th><th>Cartão (Serial)</th><th>Status</th><th>Ação</th></tr></thead><tbody>'+allData.map(function(r){return '<tr><td>'+fmtD(r.dateTime)+'</td><td><b style="color:var(--txt)">'+esc(r.plate)+'</b></td><td><span style="font-family:var(--mono);font-size:10px">'+esc(r.serial)+'</span></td><td><span class="badge riskb">Não cadastrado</span></td><td><button style="height:24px;padding:0 8px;font-size:10px;" onclick="openModal(\''+esc(r.serial)+'\')">Vincular</button></td></tr>';}).join('')+'</tbody></table>') : '<div style="padding:25px;text-align:center;color:var(--mut)">Nenhum registro.</div>';
  // map markers by plate best-effort: none
}
function openModal(serial){document.getElementById('modal-card').textContent='Cartão: '+serial;document.getElementById('modal-bg').style.display='flex';document.getElementById('modal-bg').dataset.serial=serial;}
function closeModal(){document.getElementById('modal-bg').style.display='none';}
document.getElementById('modal-cancel').addEventListener('click',closeModal);
document.getElementById('modal-save').addEventListener('click',function(){
  var serial=document.getElementById('modal-bg').dataset.serial;
  var uid=document.getElementById('modal-user').value;
  var u=userMap[uid];
  if(!u){alert('Selecione um usuário');return;}
  var keys=Array.isArray(u.keys)?u.keys.slice():[];
  if(keys.indexOf(serial)===-1) keys.push(serial);
  _api.call('Set',{typeName:'User',entity:{id:uid,keys:keys}},function(){alert('Cartão vinculado!');closeModal();},function(e){alert('Erro: '+JSON.stringify(e));});
});

document.getElementById('btn-fetch').addEventListener('click',fetchAudit);
document.getElementById('sel-group').addEventListener('change',populateDevice);
document.getElementById('inp-search').addEventListener('input',function(){});

if(isMockMode){
  var mockApi={call:function(m,p,ok,err){
    if(p.typeName==='Group') ok([{id:'g1',name:'Operacao Norte'},{id:'g2',name:'Operacao Sul'}]);
    else if(p.typeName==='Device') ok([{id:'b1',name:'ABC1D23 | FIAT | ARGO',licensePlate:'ABC1D23',groups:[{id:'g1'}]},{id:'b2',name:'ABC1234 | VW',licensePlate:'ABC1234',groups:[{id:'g2'}]}]);
    else if(p.typeName==='User') ok([{id:'u1',name:'motorista1@exemplo.com',firstName:'Motorista',lastName:'Um',isDriver:true,keys:[]},{id:'u2',name:'motorista2@exemplo.com',firstName:'Motorista',lastName:'Dois',isDriver:true,keys:[]}]);
    else if(p.typeName==='Audit') ok([
      {name:'Unassigned driver key',comment:'Please add the driver/passenger key 1234567890, as it is currently unassigned. The key was used on vehicle ABC1D23',dateTime:'2026-11-09T10:17:57Z'},
      {name:'Unassigned driver key',comment:'Please add the driver/passenger key 99887766, as it is currently unassigned. The key was used on vehicle ABC1234',dateTime:'2026-11-08T09:00:00Z'}
    ]);
    else ok([]);
  }};
  window.geotab.addin.unassigned_keys(mockApi,{});
}
</script>
</body>
</html>
