<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Chaves Não Cadastradas — Geotab Add-In</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>html,body{margin:0;padding:0;background:#f5f8fc;color:#172033;font-family:'Segoe UI',system-ui,sans-serif}</style>
</head>
<body>
<div id="app"><div style="padding:40px;color:#64748b;font-size:13px">Carregando Chaves Não Cadastradas...</div></div>
<style>
*{box-sizing:border-box}:root{--bg:#f5f8fc;--card:#fff;--card2:#f8fbff;--txt:#172033;--mut:#64748b;--mut2:#94a3b8;--bd:#e5eaf1;--blue:#0ea5e9;--blue2:#0369a1;--green:#10b981;--yellow:#f59e0b;--orange:#f97316;--red:#ef4444;--gray:#64748b;--shadow:0 12px 28px rgba(15,23,42,.06);--mono:Consolas,monospace}body,#app{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);min-height:100vh;color:var(--txt);padding:16px 20px;background-image:radial-gradient(circle,rgba(15,23,42,.045) 1px,transparent 1px);background-size:24px 24px}.head,.bar,.info,.panel,.kpi{background:var(--card);border:1px solid var(--bd);border-radius:16px;box-shadow:var(--shadow)}.head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;margin-bottom:12px}.title{display:flex;gap:10px;align-items:center;font-weight:800;font-size:18px}.ico{width:46px;height:46px;border-radius:10px;background:#000;display:grid;place-items:center;overflow:hidden;color:#fff;font-weight:800;font-size:14px}.sub{font-family:var(--mono);font-size:10px;color:var(--mut);font-weight:400}.pill{font-family:var(--mono);font-size:10px;color:var(--blue2);background:#fff;border:1px solid var(--bd);border-radius:99px;padding:5px 12px}.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px;margin-bottom:12px}.info{display:flex;gap:16px;flex-wrap:wrap;padding:9px 14px;margin-bottom:12px;color:var(--mut);font-size:12px}button,select,input{height:32px;border-radius:8px;border:1px solid var(--bd);background:#fff;color:var(--txt);font-size:11px;padding:0 10px}button{font-weight:700;cursor:pointer}.primary{background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;border:0}.alert{padding:10px 14px;border-radius:10px;margin-bottom:12px;font-size:12px;background:rgba(14,165,233,.1);border:1px solid rgba(14,165,233,.22);color:var(--blue2)}.alert.ok{background:rgba(16,185,129,.12);border-color:rgba(16,185,129,.22);color:#047857}.alert.err{background:rgba(239,68,68,.11);border-color:rgba(239,68,68,.22);color:#991b1b}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:12px}.kpi{padding:16px 14px;min-height:116px;position:relative;overflow:hidden}.kpi span{display:block;color:var(--mut2);font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px}.kpi b{font-family:var(--mono);font-size:30px;line-height:1}.kpi small{display:block;color:var(--mut);font-size:12px;margin-top:4px}.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}.panel{padding:16px 18px;margin-bottom:12px}.pt{font-size:12px;font-weight:800;color:var(--blue2);letter-spacing:.06em;text-transform:uppercase;margin-bottom:12px}.pt:before{content:'';display:inline-block;width:3px;height:12px;background:linear-gradient(var(--blue),var(--blue2));border-radius:2px;margin-right:7px;vertical-align:-2px}table{width:100%;border-collapse:collapse;font-size:11px}th{text-align:left;background:#f0f9ff;color:var(--blue2);font-size:9px;text-transform:uppercase;letter-spacing:.06em;padding:8px 10px}td{padding:8px 10px;border-bottom:1px solid #edf2f7;color:var(--mut);vertical-align:middle}tr:hover td{background:#f8fbff}.badge{display:inline-block;border-radius:99px;padding:2px 9px;font-size:10px;font-weight:800;font-family:var(--mono)}.okb{background:rgba(16,185,129,.12);color:#047857}.warnb{background:rgba(245,158,11,.13);color:#92400e}.riskb{background:rgba(239,68,68,.11);color:#991b1b}.map{height:340px;border:1px solid var(--bd);border-radius:16px;overflow:hidden}.mono{font-family:var(--mono)}@media(max-width:900px){.cols{grid-template-columns:1fr}}@media(max-width:700px){body,#app{padding:10px}.bar{align-items:stretch;flex-direction:column}.grid{grid-template-columns:1fr}}
button[disabled]{opacity:.78;cursor:wait}.spinner{width:14px;height:14px;display:inline-block;border:2px solid rgba(255,255,255,.5);border-top-color:#fff;border-radius:50%;vertical-align:-2px;margin-right:7px;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
</style>
<script>
(function(){
'use strict';
var apiRef=null,map=null,layer=null,allRows=[],filtered=[],validRows=[],filteredValid=[],devices={},groups={},deviceGroupIds={},users={};
var DAY=86400000;
var $=function(id){return document.getElementById(id);};
var esc=function(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');};
var fmt=v=>v==null||isNaN(Number(v))?'N/I':Number(v).toFixed(2);
var fmtDate=function(d){var t=new Date(d);return isNaN(t)?'-':t.toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});};
var call=function(t,s){return new Promise(function(ok,err){apiRef.call('Get',{typeName:t,search:s||{}},ok,err);});};

function shell(){
  $('app').innerHTML=
    '<div class="head"><div class="title"><div class="ico">CK</div><div><strong>Chaves Não Cadastradas</strong><div class="sub">Controle de cartões não vinculados • Geotab</div></div></div><div class="pill" id="statusBox">Conectando...</div></div>'+
    '<div class="bar">'+
      '<select id="periodFilter">'+
        '<option value="today" selected>Hoje</option>'+
        '<option value="7d">7 dias</option>'+
        '<option value="30d">30 dias</option>'+
        '<option value="90d">90 dias</option>'+
      '</select>'+
      '<select id="groupFilter"><option value="">Todos os grupos</option></select>'+
      '<select id="deviceFilter"><option value="">Todos os veículos</option></select>'+
      '<input id="queryFilter" placeholder="Placa ou cartão..."/>'+
      '<button class="primary" id="refreshBtn">Buscar dados</button>'+
    '</div>'+
    '<div class="info"><span>Registros: <b id="countBox">0</b></span><span>Audit escaneados: <b id="scannedBox">0</b></span><span>DriverChange escaneados: <b id="dcBox">0</b></span><span id="filterInfo"></span></div>'+
    '<div id="alertBox" class="alert" style="display:none"></div>'+
    '<div id="kpisBox" class="grid"></div>'+
    '<div class="cols"><div class="panel"><div class="pt">Mapa dos veículos com tentativas</div><div id="mapBox" class="map"></div></div>'+
      '<div class="panel"><div class="pt">Resumo</div><div id="summaryBox" style="color:var(--mut);font-size:12px">—</div></div></div>'+
    '<div class="panel"><div class="pt">Tentativas de cartões não cadastrados</div><div id="tableBox"></div></div>'+
    '<div class="panel"><div class="pt">Viagens validadas por dia (cartões cadastrados)</div><div id="dailyBox" style="color:var(--mut);font-size:12px">—</div></div>'+
    '<div class="panel"><div class="pt">Leituras válidas (cartões cadastrados)</div><div id="validTableBox"></div></div>'+
    '<footer style="text-align:center;font-size:11px;color:var(--mut);padding:8px 0">Projeto independente • Licença MIT</footer>';
  $('refreshBtn').onclick=function(){load(apiRef);};
  $('periodFilter').onchange=apply;
  $('groupFilter').onchange=apply;
  $('deviceFilter').onchange=apply;
  $('queryFilter').oninput=apply;
}
function setStatus(t){var e=$('statusBox');if(e)e.textContent=t;}
function alertMsg(t,ok,err){var e=$('alertBox');if(!e)return;e.style.display=t?'block':'none';e.className='alert '+(ok?'ok':err?'err':'');e.textContent=t||'';}

function getRange(){
  var now=new Date(), today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  var p=($('periodFilter')&&$('periodFilter').value)||'today';
  if(p==='today')return{from:today,to:now};
  if(p==='7d')return{from:new Date(today.getTime()-6*DAY),to:now};
  if(p==='30d')return{from:new Date(today.getTime()-29*DAY),to:now};
  if(p==='90d')return{from:new Date(today.getTime()-89*DAY),to:now};
  return{from:today,to:now};
}

async function load(api){
  if(!api){setStatus('Não conectado');alertMsg('Abra este add-in dentro do MyGeotab para carregar dados reais.',false,true);return;}
  apiRef=api;
  setStatus('Carregando...');alertMsg('');
  var rng=getRange();
  try{
    var gr=await call('Group',{}).catch(function(){return[];});
    groups={};gr.forEach(function(g){if(g&&g.id)groups[g.id]=g;});
    $('groupFilter').innerHTML='<option value="">Todos os grupos</option>'+gr.filter(function(g){return g&&g.name&&g.name!=='GroupCompanyId';}).sort(function(a,b){return a.name.localeCompare(b.name);}).map(function(g){return '<option value="'+esc(g.id)+'">'+esc(g.name)+'</option>';}).join('');
    var dv=await call('Device',{}).catch(function(){return[];});
    devices={};deviceGroupIds={};
    dv.forEach(function(d){if(!d||!d.name)return;var plate=inferPlate(d);devices[d.id]={id:d.id,name:d.name,plate:plate};deviceGroupIds[d.id]=(d.groups||[]).map(function(x){return x.id;});});
    $('deviceFilter').innerHTML='<option value="">Todos os veículos</option>'+Object.values(devices).sort(function(a,b){return a.plate.localeCompare(b.plate);}).map(function(d){return '<option value="'+esc(d.id)+'">'+esc(d.plate)+'</option>';}).join('');
    var us=await call('User',{}).catch(function(){return[];});
    users={};(us||[]).forEach(function(u){if(u&&u.id)users[u.id]=u;});

    setStatus('Buscando Audit...');
    var aud=await call('Audit',{fromDate:rng.from.toISOString(),toDate:rng.to.toISOString()});
    var scanned=(aud||[]).length;
    allRows=[];
    (aud||[]).forEach(function(a){
      var txt=((a.name||'')+' '+(a.comment||'')).replace(/\s+/g,' ').trim();
      var low=txt.toLowerCase();
      // ignora eventos de segurança que contêm "key" (create/restore/saved/api/backup...)
      if(/(create|restore|saved|save|api|security|backup|certificate|revoke|delete|update|edit).{0,12}key/.test(low)) return;
      var matchKey=(low.indexOf('key')!==-1||low.indexOf('chave')!==-1||low.indexOf('cart')!==-1||low.indexOf('inserir')!==-1);
      var matchUnassigned=(low.indexOf('unassign')!==-1||low.indexOf('não atrib')!==-1||low.indexOf('nao atrib')!==-1||low.indexOf('não cadastr')!==-1||low.indexOf('nao cadastr')!==-1||low.indexOf('without')!==-1);
      if(!matchKey && !matchUnassigned) return;
      var serial=extractSerial(txt);
      var plate=extractPlate(txt);
      // descarta registros sem cartão e sem veículo (ruído)
      if(!serial && !plate) return;
      var devInfo=findDeviceByPlate(plate);
      allRows.push({
        dateTime:a.dateTime?new Date(a.dateTime):null,
        serial:serial||'—',
        plate:plate||(devInfo?devInfo.plate:'—'),
        deviceId:devInfo?devInfo.id:'',
        deviceName:devInfo?devInfo.name:(plate||'—')
      });
    });
    // ordena do mais recente
    allRows.sort(function(a,b){return (b.dateTime||0)-(a.dateTime||0);});
    $('scannedBox').textContent=scanned;

    // leituras válidas (cartões cadastrados) via DriverChange
    setStatus('Buscando leituras válidas...');
    var dcs=await call('DriverChange',{fromDate:rng.from.toISOString(),toDate:rng.to.toISOString()}).catch(function(){return[];});
    var dScanned=(dcs||[]).length;
    validRows=[];
    (dcs||[]).forEach(function(d){
      var did=d.device&&d.device.id;if(!did)return;
      var drv=d.driver&&d.driver.id;
      if(!drv||String(drv).toLowerCase().indexOf('unknown')!==-1)return;
      var dev=devices[did]||{};var u=users[drv]||{};
      validRows.push({
        dateTime:d.dateTime?new Date(d.dateTime):null,
        plate:dev.plate||dev.name||'—',
        deviceId:did,
        deviceName:dev.name||dev.plate||'—',
        driverId:drv,
        driverName:(u.name||((u.firstName||'')+' '+(u.lastName||'')).trim()||drv),
        type:d.type||''
      });
    });
    validRows.sort(function(a,b){return (b.dateTime||0)-(a.dateTime||0);});
    $('dcBox').textContent=dScanned;

    filtered=allRows.slice();
    apply();
    var msgTxt='Não cadastrados: '+allRows.length+' • Leituras válidas: '+validRows.length;
    if(!allRows.length && !validRows.length){alertMsg('Nenhum registro encontrado no período. Audit: '+scanned+' • DriverChange: '+dScanned,false,false);setStatus('0 registros');}
    else{alertMsg(msgTxt,true,false);setStatus(msgTxt);}
  }catch(e){
    console.error('[UK] load error',e);
    setStatus('Erro');
    alertMsg('Erro ao carregar: '+(e&&(e.message||e.name)||'desconhecido'),false,true);
  }
}
function inferPlate(d){var p=(d.licensePlate||'').trim();if(p)return p;var n=(d.name||'').trim();var m=n.match(/^([^|]+)\s*\|/);if(m&&m[1])return m[1].trim();return n||d.id;}
function extractSerial(txt){var m=txt.match(/\b\d{6,20}\b/);if(m)return m[0];var h=txt.match(/\b(?=[0-9A-Fa-f]*\d)[0-9A-Fa-f]{8,20}\b/);return h?h[0]:'';}
function extractPlate(txt){var m=txt.match(/\b[A-Z]{3}\d[A-Z0-9]\d{2}\b/);return m?m[0]:'';}
function findDeviceByPlate(plate){if(!plate)return null;var k=Object.keys(devices);for(var i=0;i<k.length;i++){var d=devices[k[i]];if(d.plate===plate||(d.name||'').indexOf(plate)!==-1)return d;}return null;}

function apply(){
  var g=$('groupFilter')?$('groupFilter').value:'';
  var d=$('deviceFilter')?$('deviceFilter').value:'';
  var q=($('queryFilter')&&$('queryFilter').value||'').toLowerCase().trim();
  var pass=function(r){
    if(d && r.deviceId!==d) return false;
    if(g && !(deviceGroupIds[r.deviceId]||[]).some(function(id){return id===g;})) return false;
    if(q){var blob=(r.plate+' '+(r.serial||'')+' '+(r.driverName||'')+' '+(r.deviceName||'')).toLowerCase();if(blob.indexOf(q)===-1)return false;}
    return true;
  };
  filtered=allRows.filter(pass);
  filteredValid=validRows.filter(pass);
  render();
}
function dayKey(d){var t=new Date(d);if(isNaN(t))return '';return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');}

function render(){
  $('countBox').textContent=filtered.length.toLocaleString('pt-BR');
  var serials={},plates={};
  filtered.forEach(function(r){serials[r.serial]=1;if(r.plate&&r.plate!=='—')plates[r.plate]=1;});
  var uniqCards=Object.keys(serials).length, uniqDev=Object.keys(plates).length;
  var last=filtered[0];

  var vDrivers={},vPlates={},days={};
  filteredValid.forEach(function(r){if(r.driverId)vDrivers[r.driverId]=1;if(r.plate&&r.plate!=='—')vPlates[r.plate]=1;var k=dayKey(r.dateTime);if(k)days[k]=(days[k]||0)+1;});
  var vDriversN=Object.keys(vDrivers).length, dayCount=Object.keys(days).length;
  var vLast=filteredValid[0];
  var avg=dayCount?(filteredValid.length/dayCount):0;

  var cards=[
    ['Tentativas',filtered.length,'registros no período','var(--red)'],
    ['Cartões não cadastrados',uniqCards,'seriais distintos','var(--orange)'],
    ['Veículos afetados',uniqDev,'veículos distintos','var(--blue)'],
    ['Última tentativa',last?fmtDate(last.dateTime):'—','','var(--gray)'],
    ['Leituras válidas',filteredValid.length,'cartões cadastrados','var(--green)'],
    ['Motoristas distintos',vDriversN,'motoristas','var(--blue)'],
    ['Média validações/dia',avg?avg.toFixed(1):'0','por dia no período','var(--green)'],
    ['Última leitura válida',vLast?fmtDate(vLast.dateTime):'—','','var(--gray)']
  ];
  $('kpisBox').innerHTML=cards.map(function(r){return '<div class="kpi"><span>'+r[0]+'</span><b style="color:'+r[3]+';font-size:'+(r[0].indexOf('Última')===0?'14px':'30px')+'">'+esc(r[1])+'</b><small>'+esc(r[2])+'</small></div>';}).join('');

  renderTable();
  renderSummary(uniqCards,uniqDev);
  renderDaily(days);
  renderValidTable();
  renderMap();
}
function renderDaily(days){
  var box=$('dailyBox');if(!box)return;
  var keys=Object.keys(days).sort().reverse().slice(0,31);
  if(!keys.length){box.innerHTML='<div>Sem leituras válidas no período.</div>';return;}
  var max=Math.max.apply(null,keys.map(function(k){return days[k];}));
  box.innerHTML='<div style="display:grid;gap:8px">'+keys.map(function(k){
    var w=Math.max(6,Math.round(days[k]/max*100));
    var lbl=k.split('-').reverse().join('/');
    return '<div><div style="display:flex;justify-content:space-between"><span class="mono">'+esc(lbl)+'</span><b>'+days[k]+'</b></div><div style="height:10px;background:#eaf4fb;border-radius:20px;overflow:hidden;margin-top:3px"><div style="height:10px;width:'+w+'%;background:var(--green);border-radius:20px"></div></div></div>';
  }).join('')+'</div>';
}
function renderValidTable(){
  var box=$('validTableBox');if(!box)return;
  if(!filteredValid.length){box.innerHTML='<div style="padding:25px;text-align:center;color:var(--mut)">Nenhuma leitura válida.</div>';return;}
  box.innerHTML='<table><thead><tr><th>Data/Hora</th><th>Veículo (Placa)</th><th>Motorista</th><th>Status</th></tr></thead><tbody>'+
    filteredValid.map(function(r){
      return '<tr><td>'+fmtDate(r.dateTime)+'</td><td><b style="color:var(--txt)">'+esc(r.plate)+'</b></td><td>'+esc(r.driverName)+'</td><td><span class="badge okb">Válido</span></td></tr>';
    }).join('')+'</tbody></table>';
}
function renderSummary(uniqCards,uniqDev){
  var byCard={};filtered.forEach(function(r){byCard[r.serial]=(byCard[r.serial]||0)+1;});
  var rows=Object.entries(byCard).sort(function(a,b){return b[1]-a[1];}).slice(0,8);
  var max=rows.length?rows[0][1]:1;
  $('summaryBox').innerHTML=rows.length?('<div style="display:grid;gap:8px">'+rows.map(function(r){
    var w=Math.max(6,Math.round(r[1]/max*100));
    return '<div><div style="display:flex;justify-content:space-between"><span class="mono">'+esc(r[0])+'</span><b>'+r[1]+'</b></div><div style="height:10px;background:#eaf4fb;border-radius:20px;overflow:hidden;margin-top:3px"><div style="height:10px;width:'+w+'%;background:var(--orange);border-radius:20px"></div></div></div>';
  }).join('')+'</div>'):'<div>Sem dados no período.</div>';
}
function renderTable(){
  if(!filtered.length){$('tableBox').innerHTML='<div style="padding:25px;text-align:center;color:var(--mut)">Nenhum registro.</div>';return;}
  $('tableBox').innerHTML='<table><thead><tr><th>Data/Hora</th><th>Veículo (Placa)</th><th>Cartão (Serial)</th><th>Status</th><th>Ação</th></tr></thead><tbody>'+
    filtered.map(function(r){
      return '<tr><td>'+fmtDate(r.dateTime)+'</td><td><b style="color:var(--txt)">'+esc(r.plate)+'</b></td><td><span class="mono">'+esc(r.serial)+'</span></td><td><span class="badge riskb">Não cadastrado</span></td><td><span class="badge warnb">Cadastrar no Geotab</span></td></tr>';
    }).join('')+'</tbody></table>';
}
function initMap(){
  if(!window.L||!$('mapBox'))return;
  map=L.map('mapBox').setView([-15.8,-47.9],4);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OSM'}).addTo(map);
  layer=L.layerGroup().addTo(map);
  setTimeout(function(){map.invalidateSize();},300);
}
function renderMap(){
  if(!map){initMap();}
  if(!layer)return;
  layer.clearLayers();
  // usa última posição conhecida via DeviceStatusInfo para veículos com tentativas
  var ids=Object.keys(filtered.reduce(function(acc,r){if(r.deviceId)acc[r.deviceId]=1;return acc;},{}));
  if(!ids.length)return;
  call('DeviceStatusInfo',{}).then(function(list){
    (list||[]).forEach(function(s){
      var id=s.device&&s.device.id;if(!id||ids.indexOf(id)===-1)return;
      var lat=s.latitude!=null?Number(s.latitude):null,lng=s.longitude!=null?Number(s.longitude):null;
      if(lat==null||lng==null||isNaN(lat)||isNaN(lng))return;
      var dev=devices[id]||{};
      var m=L.circleMarker([lat,lng],{radius:9,fillColor:'#ef4444',color:'#fff',weight:1.5,fillOpacity:.88});
      m.bindPopup('<b>'+esc(dev.plate||dev.name||id)+'</b>');
      layer.addLayer(m);
    });
    var pts=[];layer.eachLayer(function(l){pts.push(l.getLatLng());});
    if(pts.length){map.setView([pts.reduce(function(a,p){return a+p.lat;},0)/pts.length,pts.reduce(function(a,p){return a+p.lng;},0)/pts.length],6);}
  }).catch(function(){});
}

function init(api){
  try{
    apiRef=api;shell();setStatus('Pronto');
    load(api);
  }catch(e){
    console.error(e);var r=$('app');if(r)r.innerHTML='<div style="padding:20px;color:#991b1b">Erro ao iniciar: '+esc(e.message||e)+'</div>';
  }
}
if(!window.geotab)window.geotab={addin:{}};if(!window.geotab.addin)window.geotab.addin={};
